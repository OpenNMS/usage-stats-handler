version: '3.4'

networks:
  stats_network:
    driver: bridge

services:
  usage_stats_handler:
    container_name: usage_stats_handler
    build: .
    ports:
      - "3542:3542"
    environment:
      - DATABASE_URL=postgres://usagestats:usagestats@postgres:5432/usagestats
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      stats_network:
  postgres:
    container_name: postgres
    image: 'docker.io/library/postgres:16-alpine'
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=usagestats
      - POSTGRES_PASSWORD=usagestats
      - POSTGRES_DB=usagestats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usagestats -d usagestats"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: on-failure
    networks:
      stats_network:
  grafana:
    container_name: grafana
    image: 'docker.io/grafana/grafana:12.0.2'
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      stats_network:

volumes:
  postgres-data:
    driver: local
