apiVersion: 1

datasources:
  - id: 1
    uid: usagestats-postgres
    orgId: 1
    name: PostgreSQL (Usage Stats)
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: usagestats
    database: usagestats
    isDefault: true
    secureJsonData:
      password: usagestats
    jsonData:
      database: usagestats
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    readOnly: false
